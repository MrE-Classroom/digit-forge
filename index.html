<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digit Forge: The Greatest Product Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const FlameIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    );
    const RotateIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    );
    const ArrowRightIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    );
    const StarIcon = ({ fill }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={fill ? "currentColor" : "none"} stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    );
    const Volume2Icon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    );
    const VolumeXIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
    );
    const HelpCircleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    );
    const ChevronUpIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    );
    const ChevronDownIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    );
    const MousePointerIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 3 10.07 19.97 12.58 12.58 19.97 10.07 3 3"/><line x1="13" y1="13" x2="19" y2="19"/></svg>
    );
    const TrophyIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/><path d="M12 2a6 6 0 0 1 6 6v1a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z"/></svg>
    );
    const CheckCircleIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );

    const playSound = (type, muted) => {
      if (muted) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'click') {
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start(); osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'place') {
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.start(); osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'success') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
            g.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.1 + 0.25);
            o.start(ctx.currentTime + idx * 0.1); o.stop(ctx.currentTime + idx * 0.1 + 0.25);
          });
        } else if (type === 'fail') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.4);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(); osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) { console.log("Audio Context Blocked"); }
    };

    const LEVELS = [
      { id: 1, name: "Apprentice (Grade 2/3)", description: "Addition Forge: Maximize the Sum!", layout: "addition", slotsCount: 4, digitCount: 4 },
      { id: 2, name: "Journeyman (Grade 3/4)", description: "Multiplication Spark: 2-Digit × 1-Digit!", layout: "mult_2_1", slotsCount: 3, digitCount: 3 },
      { id: 3, name: "Master (Grade 4/5)", description: "Multiplication Blaze: 3-Digit × 1-Digit!", layout: "mult_3_1", slotsCount: 4, digitCount: 4 },
      { id: 4, name: "Grandmaster (Grade 5)", description: "The Ultimate Fusion: 2-Digit × 2-Digit!", layout: "mult_2_2", slotsCount: 4, digitCount: 4 }
    ];

    function permute(arr) {
      let res = [];
      const run = (curr, remaining) => {
        if (remaining.length === 0) { res.push(curr); return; }
        for (let i = 0; i < remaining.length; i++) {
          run([...curr, remaining[i]], [...remaining.slice(0, i), ...remaining.slice(i + 1)]);
        }
      };
      run([], arr);
      return res;
    }

    function App() {
      const [currentLevelIdx, setCurrentLevelIdx] = React.useState(0);
      const [digits, setDigits] = React.useState([]);
      const [slots, setSlots] = React.useState([]); 
      const [score, setScore] = React.useState(0);
      const [bestCombination, setBestCombination] = React.useState(null);
      const [maxPossibleValue, setMaxPossibleValue] = React.useState(0);
      const [isForged, setIsForged] = React.useState(false);
      const [stars, setStars] = React.useState(0);
      const [muted, setMuted] = React.useState(false);
      const [streak, setStreak] = React.useState(0);
      const [showExplanationBox, setShowExplanationBox] = React.useState(false);
      const [explanationText, setExplanationText] = React.useState("");
      const [showInstructions, setShowInstructions] = React.useState(true);
      const [instructionTab, setInstructionTab] = React.useState('objective');

      const activeLevel = LEVELS[currentLevelIdx];

      const generateNewPuzzle = () => {
        playSound('click', muted);
        const pool = [];
        while (pool.length < activeLevel.digitCount) {
          const num = Math.floor(Math.random() * 9) + 1;
          if (!pool.includes(num)) pool.push(num);
        }
        setDigits(pool);
        setSlots(Array(activeLevel.slotsCount).fill(null));
        setIsForged(false);
        setStars(0);
        setExplanationText("");
        setShowExplanationBox(false);

        const allPerms = permute(pool);
        let maxVal = -1;
        let bestArr = [];
        allPerms.forEach(p => {
          const val = evaluateEquation(p, activeLevel.layout);
          if (val > maxVal) { maxVal = val; bestArr = p; }
        });
        setMaxPossibleValue(maxVal);
        setBestCombination(bestArr);
      };

      React.useEffect(() => { generateNewPuzzle(); }, [currentLevelIdx]);

      const evaluateEquation = (arr, layout) => {
        if (layout === "addition") return (arr[0] * 10 + arr[1]) + (arr[2] * 10 + arr[3]);
        if (layout === "mult_2_1") return (arr[0] * 10 + arr[1]) * arr[2];
        if (layout === "mult_3_1") return (arr[0] * 100 + arr[1] * 10 + arr[2]) * arr[3];
        if (layout === "mult_2_2") return (arr[0] * 10 + arr[1]) * (arr[2] * 10 + arr[3]);
        return 0;
      };

      const getPlayerValue = () => slots.includes(null) ? 0 : evaluateEquation(slots, activeLevel.layout);

      const handleCardClick = (digit) => {
        playSound('place', muted);
        const emptyIdx = slots.indexOf(null);
        if (emptyIdx !== -1) {
          const newSlots = [...slots];
          newSlots[emptyIdx] = digit;
          setSlots(newSlots);
          setDigits(digits.filter(d => d !== digit));
        }
      };

      const handleSlotClick = (index) => {
        if (slots[index] === null) return;
        playSound('click', muted);
        const value = slots[index];
        const newSlots = [...slots];
        newSlots[index] = null;
        setSlots(newSlots);
        setDigits([...digits, value]);
      };

      const handleForge = () => {
        if (slots.includes(null)) return;
        const playerVal = getPlayerValue();
        const ratio = playerVal / maxPossibleValue;
        let earnedStars = 1;
        if (playerVal === maxPossibleValue) { earnedStars = 3; playSound('success', muted); setStreak(prev => prev + 1); }
        else if (ratio >= 0.85) { earnedStars = 2; playSound('success', muted); setStreak(prev => prev + 1); }
        else { playSound('fail', muted); setStreak(0); }
        setStars(earnedStars);
        setScore(prev => prev + (playerVal * earnedStars));
        setIsForged(true);
        setShowExplanationBox(true);
      };

      const renderFormulaString = (arr, layout) => {
        if (!arr) return "";
        if (layout === "addition") return `${arr[0] ?? '?'}${arr[1] ?? '?'} + ${arr[2] ?? '?'}${arr[3] ?? '?'}`;
        if (layout === "mult_2_1") return `${arr[0] ?? '?'}${arr[1] ?? '?'} × ${arr[2] ?? '?'}`;
        if (layout === "mult_3_1") return `${arr[0] ?? '?'}${arr[1] ?? '?'}${arr[2] ?? '?'} × ${arr[3] ?? '?'}`;
        if (layout === "mult_2_2") return `${arr[0] ?? '?'}${arr[1] ?? '?'} × ${arr[2] ?? '?'}${arr[3] ?? '?'}`;
      };

      const getDynamicGuideMessage = () => {
        const emptySlots = slots.filter(s => s === null).length;
        if (isForged) {
          return {
            step: "🎉 STEP 3: REFLECT & ADVANCE",
            text: "You forged it! Fill in your mathematical reasoning on the right, then hit the green button for a new puzzle!",
            color: "bg-emerald-950 border-emerald-500 text-emerald-200"
          };
        }
        if (emptySlots === activeLevel.slotsCount) {
          return {
            step: "🎯 STEP 1: CHOOSE A NUMBER CARD",
            text: "Click one of the white number cards below. It will jump up into the first empty dashed box!",
            color: "bg-purple-950 border-purple-500 text-purple-200"
          };
        }
        if (emptySlots > 0) {
          return {
            step: "⚡ STEP 1 (Continued): PLACE THE REST",
            text: `Keep clicking cards to fill the remaining ${emptySlots} empty spaces. Click any boxed number above if you want to undo!`,
            color: "bg-blue-950 border-blue-500 text-blue-200"
          };
        }
        return {
          step: "🔥 STEP 2: FORGE YOUR EQUATION",
          text: "All slots filled! Click the glowing 'Forge Expression!' button below to calculate and check your score.",
          color: "bg-orange-950 border-orange-500 text-orange-200 animate-pulse"
        };
      };

      const currentGuide = getDynamicGuideMessage();

      return (
        <div className="flex flex-col font-sans max-w-4xl w-full mx-auto p-4 md:p-8 justify-center gap-6">
          <header className="flex flex-col md:flex-row justify-between items-center gap-4 border-b border-slate-800 pb-4">
            <div className="flex items-center gap-3">
              <div className="bg-gradient-to-tr from-purple-600 to-indigo-500 p-2.5 rounded-xl shadow-lg"><FlameIcon /></div>
              <div>
                <h1 className="text-2xl font-black bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">DIGIT FORGE</h1>
                <p className="text-xs text-slate-400">The Quest for the Greatest Product</p>
              </div>
            </div>
            <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
              {LEVELS.map((level, idx) => (
                <button key={level.id} onClick={() => { setCurrentLevelIdx(idx); setStreak(0); }} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${idx === currentLevelIdx ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}>{level.name.split(' ')[0]} Lvl {level.id}</button>
              ))}
            </div>
            <div className="flex items-center gap-4">
              {streak > 0 && <div className="bg-orange-500/10 text-orange-400 border border-orange-500/20 px-3 py-1.5 rounded-lg text-xs font-black">🔥 STREAK: {streak}</div>}
              <div className="bg-slate-800 px-4 py-1.5 rounded-lg font-mono font-black text-purple-400">SCORE: {score.toLocaleString()}</div>
              <button onClick={() => setMuted(!muted)} class="p-2 bg-slate-800 rounded-lg text-slate-300">{muted ? <VolumeXIcon /> : <Volume2Icon />}</button>
            </div>
          </header>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <button onClick={() => setShowInstructions(!showInstructions)} className="w-full bg-slate-800 p-4 px-6 flex justify-between items-center text-left">
              <div className="flex items-center gap-2.5"><HelpCircleIcon /><span className="font-extrabold text-sm uppercase tracking-wider">How To Play Guide</span></div>
              {showInstructions ? <ChevronUpIcon /> : <ChevronDownIcon />}
            </button>
            {showInstructions && (
              <div className="p-6 border-t border-slate-800 bg-slate-900/50 space-y-4">
                <div className="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
                  <button onClick={() => setInstructionTab('objective')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${instructionTab === 'objective' ? 'bg-purple-600' : 'bg-slate-950 text-slate-400'}`}>🚀 Goal</button>
                  <button onClick={() => setInstructionTab('controls')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${instructionTab === 'controls' ? 'bg-purple-600' : 'bg-slate-950 text-slate-400'}`}>🖱️ Controls</button>
                  <button onClick={() => setInstructionTab('stars')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${instructionTab === 'stars' ? 'bg-purple-600' : 'bg-slate-950 text-slate-400'}`}>⭐ Scoring</button>
                </div>
                {instructionTab === 'objective' && <p className="text-sm text-slate-400">Organize random digits into a formula to construct the <strong class="text-purple-400">LARGEST</strong> numerical outcome possible.</p>}
                {instructionTab === 'controls' && <p className="text-sm text-slate-400">Click a card to send it into the equation. Click a number inside the equation box to undo it.</p>}
                {instructionTab === 'stars' && <p className="text-sm text-slate-400">Earn 3 Stars for finding the absolute maximum mathematical arrangement!</p>}
              </div>
            )}
          </div>

          <div className={`p-4 border-l-4 rounded-xl shadow-md ${currentGuide.color}`}>
            <div className="text-xs font-black uppercase tracking-widest">{currentGuide.step}</div>
            <p className="text-sm mt-1">{currentGuide.text}</p>
          </div>

          <div className="bg-gradient-to-r from-slate-900 to-slate-850 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
            <div><span className="text-xs font-bold uppercase text-purple-400">Current Arena</span><h3 className="text-lg font-black">{activeLevel.name}</h3></div>
            <span className="bg-slate-950 text-slate-400 px-3 py-1 rounded-lg text-xs font-mono font-bold border border-slate-800">{activeLevel.description}</span>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative flex flex-col items-center justify-center min-h-[260px]">
            <div className="flex flex-col items-center gap-6">
              <div className="flex flex-col items-end border-b-4 border-slate-700 pb-4 px-8 relative">
                <div className="flex gap-4 mb-4">
                  {activeLevel.layout === "mult_3_1" ? (
                    <>
                      <button onClick={() => handleSlotClick(0)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[0] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[0] ?? ''}<span className="text-[10px] text-slate-500">H</span></button>
                      <button onClick={() => handleSlotClick(1)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[1] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[1] ?? ''}<span className="text-[10px] text-slate-500">T</span></button>
                      <button onClick={() => handleSlotClick(2)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[2] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[2] ?? ''}<span className="text-[10px] text-slate-500">O</span></button>
                    </>
                  ) : (
                    <>
                      <button onClick={() => handleSlotClick(0)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[0] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[0] ?? ''}<span className="text-[10px] text-slate-500">T</span></button>
                      <button onClick={() => handleSlotClick(1)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[1] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[1] ?? ''}<span className="text-[10px] text-slate-500">O</span></button>
                    </>
                  )}
                </div>
                <div className="flex gap-4 items-center justify-end w-full">
                  <span className="text-4xl font-black text-slate-400 mr-2">{activeLevel.layout === "addition" ? "+" : "×"}</span>
                  {activeLevel.layout === "mult_3_1" ? (
                    <button onClick={() => handleSlotClick(3)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[3] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[3] ?? ''}<span className="text-[10px] text-slate-500">O</span></button>
                  ) : activeLevel.layout === "mult_2_1" ? (
                    <button onClick={() => handleSlotClick(2)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[2] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[2] ?? ''}<span className="text-[10px] text-slate-500">O</span></button>
                  ) : (
                    <>
                      <button onClick={() => handleSlotClick(2)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[2] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[2] ?? ''}<span className="text-[10px] text-slate-500">T</span></button>
                      <button onClick={() => handleSlotClick(3)} className={`w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex flex-col items-center justify-center text-4xl font-black border-2 border-dashed ${slots[3] !== null ? 'bg-purple-600 text-white border-purple-400' : 'border-slate-700 text-slate-600'}`}>{slots[3] ?? ''}<span className="text-[10px] text-slate-500">O</span></button>
                    </>
                  )}
                </div>
              </div>
              <div className="text-center mt-2">
                <span className="text-xs uppercase font-extrabold tracking-wider text-slate-500">Formed Outcome</span>
                <div className="text-5xl font-black text-white">{slots.includes(null) ? "????" : getPlayerValue().toLocaleString()}</div>
              </div>
            </div>
            {slots.includes(null) && <div className="absolute bottom-2 text-xs text-slate-500 flex items-center gap-1.5"><MousePointerIcon /> Tip: Click an item inside the equation box to remove it.</div>}
          </div>

          <div className="flex flex-col items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
            <p className="text-xs font-extrabold uppercase text-purple-400">Your Number Cards</p>
            <div className="flex justify-center gap-4 flex-wrap min-h-[80px] items-center">
              {digits.length === 0 && !isForged && <span className="text-sm text-emerald-400 font-bold flex items-center gap-2 bg-emerald-950/40 px-4 py-2 rounded-xl border border-emerald-900"><CheckCircleIcon /> Expression Full! Click 'Forge' below.</span>}
              {digits.map((digit, idx) => (
                <button key={idx} onClick={() => handleCardClick(digit)} disabled={isForged} className="w-16 h-16 bg-white hover:bg-slate-100 text-slate-950 font-black text-4xl rounded-2xl shadow-xl transition-all disabled:opacity-50 border-b-4 border-slate-300">{digit}</button>
              ))}
            </div>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
            <button onClick={() => { setSlots(Array(activeLevel.slotsCount).fill(null)); setDigits([...bestCombination].sort(() => Math.random() - 0.5)); setIsForged(false); setStars(0); setShowExplanationBox(false); playSound('click', muted); }} className="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-white font-extrabold py-3 px-6 rounded-xl flex items-center justify-center gap-2"><RotateIcon /> Reset Board</button>
            {!isForged ? (
              <button onClick={handleForge} disabled={slots.includes(null)} className="w-full sm:w-auto bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold py-3 px-10 rounded-xl disabled:opacity-50">Forge Expression!</button>
            ) : (
              <button onClick={generateNewPuzzle} className="w-full sm:w-auto bg-gradient-to-r from-green-600 to-emerald-600 text-white font-extrabold py-3 px-10 rounded-xl flex items-center justify-center gap-2">Next Forge Puzzle <ArrowRightIcon /></button>
            )}
          </div>

          {showExplanationBox && (
            <div className="bg-slate-900 border-2 border-slate-800 rounded-3xl p-6 shadow-2xl mt-4">
              <div className="flex flex-col md:flex-row justify-between items-center gap-4 pb-4 border-b border-slate-800">
                <div className="flex items-center gap-3">
                  <TrophyIcon />
                  <div><h3 className="text-xl font-black">Calculation Complete!</h3><p className="text-xs text-slate-400">Let's check how your arrangement compares to the mathematically perfect answer:</p></div>
                </div>
                <div className="flex gap-1 bg-slate-950 p-2 rounded-xl border border-slate-850">
                  {[1, 2, 3].map((s) => <StarIcon key={s} fill={s <= stars} />)}
                </div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                <div className="space-y-4">
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-850"><p className="text-xs font-bold text-slate-500 uppercase">Your Layout</p><p className="text-xl font-mono font-bold text-purple-400">{renderFormulaString(slots, activeLevel.layout)} = {getPlayerValue().toLocaleString()}</p></div>
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-850"><p className="text-xs font-bold text-slate-500 uppercase">The Maximum Outcome</p><p className="text-xl font-mono font-bold text-emerald-400">{renderFormulaString(bestCombination, activeLevel.layout)} = {maxPossibleValue.toLocaleString()}</p></div>
                </div>
                <div className="bg-purple-950/10 border border-purple-500/20 rounded-2xl p-4 flex flex-col justify-between">
                  <div>
                    <h4 className="font-extrabold text-sm flex items-center gap-2 mb-1"><CheckCircleIcon /> Reflect on your Strategy</h4>
                    <p className="text-xs text-slate-400 mb-2">How does moving your high digits into the higher values columns affect the product?</p>
                    <textarea rows={2} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-200 focus:outline-none" placeholder="The product is greater because..." value={explanationText} onChange={(e) => setExplanationText(e.target.value)} />
                  </div>
                  <div className="flex gap-2 mt-2">
                    <button onClick={() => setExplanationText("The product is greater because ")} className="bg-purple-950 text-purple-300 p-1.5 rounded text-[11px] border border-purple-800">"The product is greater..."</button>
                    <button onClick={() => setExplanationText("I know this because ")} className="bg-purple-950 text-purple-300 p-1.5 rounded text-[11px] border border-purple-800">"I know this because..."</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
